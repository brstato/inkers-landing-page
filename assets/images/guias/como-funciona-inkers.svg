<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 258" width="800" height="258" role="img" aria-labelledby="t d" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif"><title id="t">Como o Inkers funciona</title><desc id="d">Quatro etapas: você manda a foto, o Inkers prepara o conteúdo, você aprova e o post vai para o Instagram.</desc><rect width="800" height="258" rx="20" fill="#1e1e1e"/><text x="40" y="56" fill="#fff" font-size="26" font-weight="800" text-anchor="start">Como o Inkers funciona</text><rect x="40" y="84" width="160" height="150" rx="12" fill="#111" stroke="#333"/><circle cx="72" cy="116" r="16" fill="#FF7F50"/><text x="72" y="122" fill="#111" font-size="17" font-weight="800" text-anchor="middle">1</text><text x="56" y="160" fill="#fff" font-size="19" font-weight="800" text-anchor="start">Foto</text><text x="56" y="184" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">Você manda a foto</text><text x="56" y="204" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">do trabalho.</text><path d="M202 159 l14 0 m-6 -6 l6 6 l-6 6" fill="none" stroke="#FF7F50" stroke-width="2.5" stroke-linecap="round"/><rect x="220" y="84" width="160" height="150" rx="12" fill="#111" stroke="#333"/><circle cx="252" cy="116" r="16" fill="#FF7F50"/><text x="252" y="122" fill="#111" font-size="17" font-weight="800" text-anchor="middle">2</text><text x="236" y="160" fill="#fff" font-size="19" font-weight="800" text-anchor="start">Preparo</text><text x="236" y="184" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">Legenda,</text><text x="236" y="204" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">hashtags, dia e</text><text x="236" y="224" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">horário.</text><path d="M382 159 l14 0 m-6 -6 l6 6 l-6 6" fill="none" stroke="#FF7F50" stroke-width="2.5" stroke-linecap="round"/><rect x="400" y="84" width="160" height="150" rx="12" fill="#111" stroke="#333"/><circle cx="432" cy="116" r="16" fill="#FF7F50"/><text x="432" y="122" fill="#111" font-size="17" font-weight="800" text-anchor="middle">3</text><text x="416" y="160" fill="#fff" font-size="19" font-weight="800" text-anchor="start">Aprovação</text><text x="416" y="184" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">Você aprova com</text><text x="416" y="204" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">um toque.</text><path d="M562 159 l14 0 m-6 -6 l6 6 l-6 6" fill="none" stroke="#FF7F50" stroke-width="2.5" stroke-linecap="round"/><rect x="580" y="84" width="160" height="150" rx="12" fill="#111" stroke="#333"/><circle cx="612" cy="116" r="16" fill="#FF7F50"/><text x="612" y="122" fill="#111" font-size="17" font-weight="800" text-anchor="middle">4</text><text x="596" y="160" fill="#fff" font-size="19" font-weight="800" text-anchor="start">Publicação</text><text x="596" y="184" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">Vai para o seu</text><text x="596" y="204" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">Instagram.</text></svg>