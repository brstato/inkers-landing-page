<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 312" width="800" height="312" role="img" aria-labelledby="t d" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif"><title id="t">Antes de postar a foto do cliente</title><desc id="d">Três passos: peça autorização, guarde o registro e, se o cliente for menor de 18 anos, peça ao responsável legal. Sem autorização, a foto não é publicada.</desc><rect width="800" height="312" rx="20" fill="#1e1e1e"/><text x="40" y="56" fill="#fff" font-size="26" font-weight="800" text-anchor="start">Antes de postar a foto do cliente</text><rect x="40" y="84" width="230" height="140" rx="12" fill="#111" stroke="#333"/><circle cx="74" cy="118" r="16" fill="#FF7F50"/><text x="74" y="124" fill="#111" font-size="17" font-weight="800" text-anchor="middle">1</text><text x="58" y="160" fill="#fff" font-size="18" font-weight="800" text-anchor="start">Peça antes de postar</text><text x="58" y="186" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">Diga que a foto vai</text><text x="58" y="206" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">para o seu Instagram.</text><rect x="290" y="84" width="230" height="140" rx="12" fill="#111" stroke="#333"/><circle cx="324" cy="118" r="16" fill="#FF7F50"/><text x="324" y="124" fill="#111" font-size="17" font-weight="800" text-anchor="middle">2</text><text x="308" y="160" fill="#fff" font-size="18" font-weight="800" text-anchor="start">Guarde o registro</text><text x="308" y="186" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">Uma mensagem de</text><text x="308" y="206" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">WhatsApp já serve.</text><rect x="540" y="84" width="230" height="140" rx="12" fill="#111" stroke="#333"/><circle cx="574" cy="118" r="16" fill="#FF7F50"/><text x="574" y="124" fill="#111" font-size="17" font-weight="800" text-anchor="middle">3</text><text x="558" y="160" fill="#fff" font-size="18" font-weight="800" text-anchor="start">Menor de 18 anos</text><text x="558" y="186" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">A autorização vem de um</text><text x="558" y="206" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">responsável legal.</text><rect x="40" y="244" width="720" height="44" rx="12" fill="#FF7F50"/><text x="400" y="272" fill="#111" font-size="18" font-weight="800" text-anchor="middle">Sem autorização? Guarde a foto só para você.</text></svg>