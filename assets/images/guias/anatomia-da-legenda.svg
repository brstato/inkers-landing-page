<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" role="img" aria-labelledby="t d" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif"><title id="t">Anatomia de uma legenda de tatuagem</title><desc id="d">Quatro partes: gancho, contexto, chamada para ação e hashtags, com um exemplo de cada.</desc><rect width="800" height="410" rx="20" fill="#1e1e1e"/><text x="40" y="56" fill="#fff" font-size="26" font-weight="800">Anatomia de uma legenda de tatuagem</text><text x="40" y="84" fill="#a3a3a3" font-size="16">Texto de exemplo para adaptar ao seu jeito de falar.</text><rect x="40" y="108" width="130" height="56" rx="12" fill="#FF7F50"/><text x="105" y="143" fill="#111" font-size="18" font-weight="800" text-anchor="middle">Gancho</text><rect x="180" y="108" width="580" height="56" rx="12" fill="#111" stroke="#333"/><text x="198" y="143" fill="#f0f0f0" font-size="17">Fineline botânico no antebraço, fechado em 3 horas.</text><rect x="40" y="180" width="130" height="56" rx="12" fill="#FF7F50"/><text x="105" y="215" fill="#111" font-size="18" font-weight="800" text-anchor="middle">Contexto</text><rect x="180" y="180" width="580" height="56" rx="12" fill="#111" stroke="#333"/><text x="198" y="215" fill="#f0f0f0" font-size="17">O desenho nasceu de uma flor que a cliente plantou com a avó.</text><rect x="40" y="252" width="130" height="56" rx="12" fill="#FF7F50"/><text x="105" y="287" fill="#111" font-size="18" font-weight="800" text-anchor="middle">Chamada</text><rect x="180" y="252" width="580" height="56" rx="12" fill="#111" stroke="#333"/><text x="198" y="287" fill="#f0f0f0" font-size="17">Quer algo assim? Me chama no Direct.</text><rect x="40" y="324" width="130" height="56" rx="12" fill="#FF7F50"/><text x="105" y="359" fill="#111" font-size="18" font-weight="800" text-anchor="middle">Hashtags</text><rect x="180" y="324" width="580" height="56" rx="12" fill="#111" stroke="#333"/><text x="198" y="359" fill="#f0f0f0" font-size="17">#tatuagemfeminina #fineline #tatuagemsp</text></svg>