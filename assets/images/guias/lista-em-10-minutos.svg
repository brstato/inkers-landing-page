<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 304" width="800" height="304" role="img" aria-labelledby="t d" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif"><title id="t">Sua lista de hashtags em 10 minutos</title><desc id="d">Quatro passos: escrever seis hashtags, pesquisar cada uma, salvar combinações por tipo de post e renovar todo mês.</desc><rect width="800" height="304" rx="20" fill="#1e1e1e"/><text x="40" y="56" fill="#fff" font-size="26" font-weight="800" text-anchor="start">Sua lista de hashtags em 10 minutos</text><rect x="40" y="84" width="168" height="196" rx="12" fill="#111" stroke="#333"/><circle cx="74" cy="118" r="16" fill="#FF7F50"/><text x="74" y="124" fill="#111" font-size="17" font-weight="800" text-anchor="middle">1</text><text x="56" y="156" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">Escreva 6</text><text x="56" y="178" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">hashtags: 2 de</text><text x="56" y="200" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">estilo, 2 de</text><text x="56" y="222" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">tema e 2 da</text><text x="56" y="244" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">cidade.</text><rect x="220" y="84" width="168" height="196" rx="12" fill="#111" stroke="#333"/><circle cx="254" cy="118" r="16" fill="#FF7F50"/><text x="254" y="124" fill="#111" font-size="17" font-weight="800" text-anchor="middle">2</text><text x="236" y="156" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">Pesquise cada</text><text x="236" y="178" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">uma e veja se os</text><text x="236" y="200" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">posts têm o seu</text><text x="236" y="222" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">nível de</text><text x="236" y="244" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">trabalho.</text><rect x="400" y="84" width="168" height="196" rx="12" fill="#111" stroke="#333"/><circle cx="434" cy="118" r="16" fill="#FF7F50"/><text x="434" y="124" fill="#111" font-size="17" font-weight="800" text-anchor="middle">3</text><text x="416" y="156" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">Salve 3 ou 4</text><text x="416" y="178" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">combinações, uma</text><text x="416" y="200" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">para cada tipo</text><text x="416" y="222" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">de post.</text><rect x="580" y="84" width="168" height="196" rx="12" fill="#111" stroke="#333"/><circle cx="614" cy="118" r="16" fill="#FF7F50"/><text x="614" y="124" fill="#111" font-size="17" font-weight="800" text-anchor="middle">4</text><text x="596" y="156" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">Troque 1 ou 2</text><text x="596" y="178" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">hashtags por</text><text x="596" y="200" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">mês.</text></svg>