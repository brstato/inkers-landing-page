<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="t d" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif"><title id="t">Exemplo de semana de posts</title><desc id="d">Quatro posts no feed: trabalho finalizado na segunda, tatuagem cicatrizada na quarta, processo na sexta e dúvida ou agenda no sábado.</desc><rect width="800" height="340" rx="20" fill="#1e1e1e"/><text x="40" y="56" fill="#fff" font-size="26" font-weight="800">Uma semana de posts no feed</text><text x="40" y="84" fill="#a3a3a3" font-size="16">Exemplo de rotina com 4 posts. Ajuste os dias ao seu movimento.</text><rect x="40" y="116" width="170" height="150" rx="14" fill="#111" stroke="#333"/><rect x="40" y="116" width="170" height="38" rx="14" fill="#FF7F50"/><rect x="40" y="140" width="170" height="14" fill="#FF7F50"/><text x="125" y="142" fill="#111" font-size="18" font-weight="800" text-anchor="middle">Seg</text><text x="125" y="206" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">Trabalho</text><text x="125" y="230" fill="#a3a3a3" font-size="15" text-anchor="middle">finalizado</text><rect x="230" y="116" width="170" height="150" rx="14" fill="#111" stroke="#333"/><rect x="230" y="116" width="170" height="38" rx="14" fill="#FF7F50"/><rect x="230" y="140" width="170" height="14" fill="#FF7F50"/><text x="315" y="142" fill="#111" font-size="18" font-weight="800" text-anchor="middle">Qua</text><text x="315" y="206" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">Cicatrizada</text><text x="315" y="230" fill="#a3a3a3" font-size="15" text-anchor="middle"></text><rect x="420" y="116" width="170" height="150" rx="14" fill="#111" stroke="#333"/><rect x="420" y="116" width="170" height="38" rx="14" fill="#FF7F50"/><rect x="420" y="140" width="170" height="14" fill="#FF7F50"/><text x="505" y="142" fill="#111" font-size="18" font-weight="800" text-anchor="middle">Sex</text><text x="505" y="206" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">Processo</text><text x="505" y="230" fill="#a3a3a3" font-size="15" text-anchor="middle">ou vídeo</text><rect x="610" y="116" width="170" height="150" rx="14" fill="#111" stroke="#333"/><rect x="610" y="116" width="170" height="38" rx="14" fill="#FF7F50"/><rect x="610" y="140" width="170" height="14" fill="#FF7F50"/><text x="695" y="142" fill="#111" font-size="18" font-weight="800" text-anchor="middle">Sáb</text><text x="695" y="206" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">Dúvida</text><text x="695" y="230" fill="#a3a3a3" font-size="15" text-anchor="middle">ou agenda</text><text x="40" y="312" fill="#e8e8e8" font-size="16">Todo dia: 5 minutos para responder comentários e mensagens.</text></svg>