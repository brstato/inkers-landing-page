<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 284" width="800" height="284" role="img" aria-labelledby="t d" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif"><title id="t">Qual opção combina com você</title><desc id="d">Quem posta pouco usa o agendamento do Instagram, quem quer tudo no computador usa o Meta Business Suite e quem não tem tempo para preparar o conteúdo usa um aplicativo como o Inkers.</desc><rect width="800" height="284" rx="20" fill="#1e1e1e"/><text x="40" y="56" fill="#fff" font-size="26" font-weight="800" text-anchor="start">Qual opção combina com você?</text><rect x="40" y="84" width="230" height="176" rx="12" fill="#111" stroke="#333"/><text x="58" y="118" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">Posta pouco e gosta de</text><text x="58" y="140" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">escrever</text><rect x="58" y="196" width="194" height="46" rx="10" fill="#FF7F50"/><text x="155" y="215" fill="#111" font-size="15" font-weight="800" text-anchor="middle">Agendamento do próprio</text><text x="155" y="232" fill="#111" font-size="15" font-weight="800" text-anchor="middle">Instagram</text><rect x="290" y="84" width="230" height="176" rx="12" fill="#111" stroke="#333"/><text x="308" y="118" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">Quer Instagram e</text><text x="308" y="140" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">Facebook num só lugar,</text><text x="308" y="162" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">no computador</text><rect x="308" y="196" width="194" height="46" rx="10" fill="#FF7F50"/><text x="405" y="215" fill="#111" font-size="15" font-weight="800" text-anchor="middle">Meta Business Suite</text><rect x="540" y="84" width="230" height="176" rx="12" fill="#111" stroke="#333"/><text x="558" y="118" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">Falta tempo para</text><text x="558" y="140" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">legenda, hashtag e</text><text x="558" y="162" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">horário</text><rect x="558" y="196" width="194" height="46" rx="10" fill="#FF7F50"/><text x="655" y="215" fill="#111" font-size="15" font-weight="800" text-anchor="middle">Aplicativo como o</text><text x="655" y="232" fill="#111" font-size="15" font-weight="800" text-anchor="middle">Inkers</text></svg>