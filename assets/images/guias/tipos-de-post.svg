<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="800" height="290" role="img" aria-labelledby="t d" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif"><title id="t">Seis tipos de post para variar o feed</title><desc id="d">Trabalho finalizado, tatuagem cicatrizada, processo, flash disponível, agenda aberta e cuidados pós-tatuagem.</desc><rect width="800" height="290" rx="20" fill="#1e1e1e"/><text x="40" y="56" fill="#fff" font-size="26" font-weight="800" text-anchor="start">Seis tipos de post para variar o feed</text><rect x="40" y="84" width="230" height="84" rx="12" fill="#111" stroke="#333"/><rect x="40" y="84" width="8" height="84" rx="4" fill="#FF7F50"/><text x="64" y="120" fill="#fff" font-size="18" font-weight="800" text-anchor="start">Trabalho finalizado</text><text x="64" y="146" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">a foto principal</text><rect x="290" y="84" width="230" height="84" rx="12" fill="#111" stroke="#333"/><rect x="290" y="84" width="8" height="84" rx="4" fill="#FF7F50"/><text x="314" y="120" fill="#fff" font-size="18" font-weight="800" text-anchor="start">Tatuagem cicatrizada</text><text x="314" y="146" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">como o traço fica</text><rect x="540" y="84" width="230" height="84" rx="12" fill="#111" stroke="#333"/><rect x="540" y="84" width="8" height="84" rx="4" fill="#FF7F50"/><text x="564" y="120" fill="#fff" font-size="18" font-weight="800" text-anchor="start">Processo</text><text x="564" y="146" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">desenho, estêncil, sessão</text><rect x="40" y="182" width="230" height="84" rx="12" fill="#111" stroke="#333"/><rect x="40" y="182" width="8" height="84" rx="4" fill="#FF7F50"/><text x="64" y="218" fill="#fff" font-size="18" font-weight="800" text-anchor="start">Flash disponível</text><text x="64" y="244" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">desenhos prontos</text><rect x="290" y="182" width="230" height="84" rx="12" fill="#111" stroke="#333"/><rect x="290" y="182" width="8" height="84" rx="4" fill="#FF7F50"/><text x="314" y="218" fill="#fff" font-size="18" font-weight="800" text-anchor="start">Agenda aberta</text><text x="314" y="244" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">vagas do mês</text><rect x="540" y="182" width="230" height="84" rx="12" fill="#111" stroke="#333"/><rect x="540" y="182" width="8" height="84" rx="4" fill="#FF7F50"/><text x="564" y="218" fill="#fff" font-size="18" font-weight="800" text-anchor="start">Cuidados</text><text x="564" y="244" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">pós-tatuagem</text></svg>