<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="t d" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif"><title id="t">O que mostrar na bio do Instagram</title><desc id="d">Exemplo de bio de tatuador com três pontos: estilo, cidade e como pedir orçamento.</desc><rect width="800" height="360" rx="20" fill="#1e1e1e"/><text x="40" y="56" fill="#fff" font-size="26" font-weight="800" text-anchor="start">O que mostrar na bio do Instagram</text><text x="40" y="84" fill="#a3a3a3" font-size="16" font-weight="400" text-anchor="start">Exemplo fictício: troque pelos seus dados.</text><rect x="40" y="108" width="380" height="230" rx="12" fill="#111" stroke="#333"/><circle cx="86" cy="156" r="30" fill="#2a2a2a" stroke="#FF7F50" stroke-width="2"/><text x="86" y="163" fill="#FF7F50" font-size="22" font-weight="800" text-anchor="middle">N</text><text x="130" y="150" fill="#fff" font-size="19" font-weight="800" text-anchor="start">Nome do tatuador</text><text x="130" y="172" fill="#e8e8e8" font-size="15" font-weight="400" text-anchor="start">Tatuador · fineline e blackwork</text><text x="66" y="222" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">Fineline e blackwork</text><text x="66" y="258" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">Angra dos Reis/RJ</text><text x="66" y="294" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">Orçamento: chame no WhatsApp</text><text x="66" y="324" fill="#FF7F50" font-size="15" font-weight="700" text-anchor="start">link do seu WhatsApp</text><circle cx="460" cy="136" r="16" fill="#FF7F50"/><text x="460" y="142" fill="#111" font-size="17" font-weight="800" text-anchor="middle">1</text><text x="490" y="130" fill="#fff" font-size="18" font-weight="800" text-anchor="start">Seu estilo</text><text x="490" y="152" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">Quem não entende o que você faz não</text><text x="490" y="172" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">pergunta.</text><circle cx="460" cy="206" r="16" fill="#FF7F50"/><text x="460" y="212" fill="#111" font-size="17" font-weight="800" text-anchor="middle">2</text><text x="490" y="200" fill="#fff" font-size="18" font-weight="800" text-anchor="start">Sua cidade</text><text x="490" y="222" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">Ajuda quem procura um tatuador perto.</text><circle cx="460" cy="276" r="16" fill="#FF7F50"/><text x="460" y="282" fill="#111" font-size="17" font-weight="800" text-anchor="middle">3</text><text x="490" y="270" fill="#fff" font-size="18" font-weight="800" text-anchor="start">Como pedir orçamento</text><text x="490" y="292" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">Um único link para o canal que você</text><text x="490" y="312" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">prefere.</text></svg>