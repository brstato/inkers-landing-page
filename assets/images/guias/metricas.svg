<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 312" width="800" height="312" role="img" aria-labelledby="t d" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif"><title id="t">Três números para olhar toda semana</title><desc id="d">Alcance, salvamentos e compartilhamentos, visitas ao perfil e cliques no link.</desc><rect width="800" height="312" rx="20" fill="#1e1e1e"/><text x="40" y="56" fill="#fff" font-size="26" font-weight="800" text-anchor="start">Três números para olhar toda semana</text><text x="40" y="84" fill="#a3a3a3" font-size="16" font-weight="400" text-anchor="start">No Instagram profissional, nas informações de cada post.</text><rect x="40" y="110" width="230" height="176" rx="12" fill="#111" stroke="#333"/><rect x="40" y="110" width="230" height="8" rx="4" fill="#FF7F50"/><text x="58" y="152" fill="#fff" font-size="18" font-weight="800" text-anchor="start">Alcance</text><text x="58" y="200" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">Quantas contas viram o</text><text x="58" y="220" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">post.</text><rect x="290" y="110" width="230" height="176" rx="12" fill="#111" stroke="#333"/><rect x="290" y="110" width="230" height="8" rx="4" fill="#FF7F50"/><text x="308" y="152" fill="#fff" font-size="18" font-weight="800" text-anchor="start">Salvamentos e</text><text x="308" y="174" fill="#fff" font-size="18" font-weight="800" text-anchor="start">compartilhamentos</text><text x="308" y="218" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">Sinal de que valeu</text><text x="308" y="238" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">guardar ou enviar para</text><text x="308" y="258" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">alguém.</text><rect x="540" y="110" width="230" height="176" rx="12" fill="#111" stroke="#333"/><rect x="540" y="110" width="230" height="8" rx="4" fill="#FF7F50"/><text x="558" y="152" fill="#fff" font-size="18" font-weight="800" text-anchor="start">Visitas ao perfil e</text><text x="558" y="174" fill="#fff" font-size="18" font-weight="800" text-anchor="start">cliques no link</text><text x="558" y="218" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">Quem se interessou o</text><text x="558" y="238" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">bastante para chegar até</text><text x="558" y="258" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">você.</text></svg>