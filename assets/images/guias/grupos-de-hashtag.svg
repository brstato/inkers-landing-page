<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" role="img" aria-labelledby="t d" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif"><title id="t">Os quatro grupos de hashtag do tatuador</title><desc id="d">Quatro grupos: gerais, de estilo, de tema e da cidade, com exemplos e quando usar cada um.</desc><rect width="800" height="390" rx="20" fill="#1e1e1e"/><text x="40" y="56" fill="#fff" font-size="26" font-weight="800">Os 4 grupos de hashtag do tatuador</text><rect x="40" y="84" width="720" height="62" rx="12" fill="#111" stroke="#333"/><circle cx="76" cy="115" r="18" fill="#FF7F50"/><text x="76" y="122" fill="#111" font-size="20" font-weight="800" text-anchor="middle">1</text><text x="108" y="112" fill="#fff" font-size="19" font-weight="800">Gerais</text><text x="108" y="134" fill="#a3a3a3" font-size="15">Muita concorrência: use 1 ou 2</text><text x="740" y="122" fill="#FF7F50" font-size="16" font-weight="700" text-anchor="end">#tatuagem  #tattoo</text><rect x="40" y="158" width="720" height="62" rx="12" fill="#111" stroke="#333"/><circle cx="76" cy="189" r="18" fill="#FF7F50"/><text x="76" y="196" fill="#111" font-size="20" font-weight="800" text-anchor="middle">2</text><text x="108" y="186" fill="#fff" font-size="19" font-weight="800">Estilo</text><text x="108" y="208" fill="#a3a3a3" font-size="15">Só os estilos que você faz</text><text x="740" y="196" fill="#FF7F50" font-size="16" font-weight="700" text-anchor="end">#fineline  #blackwork  #realismo</text><rect x="40" y="232" width="720" height="62" rx="12" fill="#111" stroke="#333"/><circle cx="76" cy="263" r="18" fill="#FF7F50"/><text x="76" y="270" fill="#111" font-size="20" font-weight="800" text-anchor="middle">3</text><text x="108" y="260" fill="#fff" font-size="19" font-weight="800">Tema</text><text x="108" y="282" fill="#a3a3a3" font-size="15">O desenho da peça</text><text x="740" y="270" fill="#FF7F50" font-size="16" font-weight="700" text-anchor="end">#tatuagembotanica  #mandalatattoo</text><rect x="40" y="306" width="720" height="62" rx="12" fill="#111" stroke="#333"/><circle cx="76" cy="337" r="18" fill="#FF7F50"/><text x="76" y="344" fill="#111" font-size="20" font-weight="800" text-anchor="middle">4</text><text x="108" y="334" fill="#fff" font-size="19" font-weight="800">Cidade</text><text x="108" y="356" fill="#a3a3a3" font-size="15">Quem está perto de você</text><text x="740" y="344" fill="#FF7F50" font-size="16" font-weight="700" text-anchor="end">#tatuagem + sigla da cidade</text></svg>