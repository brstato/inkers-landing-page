<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="t d" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif"><title id="t">Quem faz o quê</title><desc id="d">Tabela comparando fazer à mão, usar um agendador e usar o Inkers: legenda, hashtags, dia e horário, e publicação. No Inkers, o aplicativo prepara e o tatuador aprova antes de publicar.</desc><rect width="800" height="340" rx="20" fill="#1e1e1e"/><text x="40" y="56" fill="#fff" font-size="26" font-weight="800" text-anchor="start">Quem faz o quê</text><text x="40" y="84" fill="#a3a3a3" font-size="16" font-weight="400" text-anchor="start">Três formas de manter o Instagram em dia.</text><text x="250" y="128" fill="#fff" font-size="18" font-weight="800" text-anchor="middle">À mão</text><text x="430" y="128" fill="#fff" font-size="18" font-weight="800" text-anchor="middle">Agendador</text><text x="610" y="128" fill="#FF7F50" font-size="18" font-weight="800" text-anchor="middle">Inkers</text><rect x="40" y="144" width="720" height="36" rx="12" fill="#111" stroke="#333"/><text x="56" y="168" fill="#fff" font-size="16" font-weight="800" text-anchor="start">Legenda</text><text x="250" y="168" fill="#d8d8d8" font-size="15" font-weight="400" text-anchor="middle">Você</text><text x="430" y="168" fill="#d8d8d8" font-size="15" font-weight="400" text-anchor="middle">Você</text><text x="610" y="168" fill="#FF7F50" font-size="15" font-weight="700" text-anchor="middle">Inkers prepara</text><rect x="40" y="188" width="720" height="36" rx="12" fill="#111" stroke="#333"/><text x="56" y="212" fill="#fff" font-size="16" font-weight="800" text-anchor="start">Hashtags</text><text x="250" y="212" fill="#d8d8d8" font-size="15" font-weight="400" text-anchor="middle">Você</text><text x="430" y="212" fill="#d8d8d8" font-size="15" font-weight="400" text-anchor="middle">Você</text><text x="610" y="212" fill="#FF7F50" font-size="15" font-weight="700" text-anchor="middle">Inkers prepara</text><rect x="40" y="232" width="720" height="36" rx="12" fill="#111" stroke="#333"/><text x="56" y="256" fill="#fff" font-size="16" font-weight="800" text-anchor="start">Dia e horário</text><text x="250" y="256" fill="#d8d8d8" font-size="15" font-weight="400" text-anchor="middle">Você</text><text x="430" y="256" fill="#d8d8d8" font-size="15" font-weight="400" text-anchor="middle">Você</text><text x="610" y="256" fill="#FF7F50" font-size="15" font-weight="700" text-anchor="middle">Inkers prepara</text><rect x="40" y="276" width="720" height="36" rx="12" fill="#111" stroke="#333"/><text x="56" y="300" fill="#fff" font-size="16" font-weight="800" text-anchor="start">Publicar</text><text x="250" y="300" fill="#d8d8d8" font-size="15" font-weight="400" text-anchor="middle">Você</text><text x="430" y="300" fill="#d8d8d8" font-size="15" font-weight="400" text-anchor="middle">A ferramenta</text><text x="610" y="300" fill="#FF7F50" font-size="15" font-weight="700" text-anchor="middle">Após a sua aprovação</text></svg>