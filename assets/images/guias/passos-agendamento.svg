<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 376" width="800" height="376" role="img" aria-labelledby="t d" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif"><title id="t">Agendar no app do Instagram, passo a passo</title><desc id="d">Cinco passos: conta profissional, criar o post, configurações avançadas, agendar esta postagem e escolher data e hora.</desc><rect width="800" height="376" rx="20" fill="#1e1e1e"/><text x="40" y="56" fill="#fff" font-size="26" font-weight="800" text-anchor="start">Agendar no app do Instagram, passo a passo</text><text x="40" y="84" fill="#a3a3a3" font-size="16" font-weight="400" text-anchor="start">Os nomes dos menus podem mudar. Conta profissional é obrigatória.</text><rect x="40" y="104" width="720" height="42" rx="12" fill="#111" stroke="#333"/><circle cx="70" cy="125" r="16" fill="#FF7F50"/><text x="70" y="131" fill="#111" font-size="17" font-weight="800" text-anchor="middle">1</text><text x="100" y="131" fill="#f0f0f0" font-size="18" font-weight="400" text-anchor="start">Passe a conta para profissional (gratuito).</text><rect x="40" y="156" width="720" height="42" rx="12" fill="#111" stroke="#333"/><circle cx="70" cy="177" r="16" fill="#FF7F50"/><text x="70" y="183" fill="#111" font-size="17" font-weight="800" text-anchor="middle">2</text><text x="100" y="183" fill="#f0f0f0" font-size="18" font-weight="400" text-anchor="start">Crie o post: foto ou vídeo, edição e legenda.</text><rect x="40" y="208" width="720" height="42" rx="12" fill="#111" stroke="#333"/><circle cx="70" cy="229" r="16" fill="#FF7F50"/><text x="70" y="235" fill="#111" font-size="17" font-weight="800" text-anchor="middle">3</text><text x="100" y="235" fill="#f0f0f0" font-size="18" font-weight="400" text-anchor="start">Na última tela: &quot;Configurações avançadas&quot;.</text><rect x="40" y="260" width="720" height="42" rx="12" fill="#111" stroke="#333"/><circle cx="70" cy="281" r="16" fill="#FF7F50"/><text x="70" y="287" fill="#111" font-size="17" font-weight="800" text-anchor="middle">4</text><text x="100" y="287" fill="#f0f0f0" font-size="18" font-weight="400" text-anchor="start">Toque em &quot;Agendar esta postagem&quot;.</text><rect x="40" y="312" width="720" height="42" rx="12" fill="#111" stroke="#333"/><circle cx="70" cy="333" r="16" fill="#FF7F50"/><text x="70" y="339" fill="#111" font-size="17" font-weight="800" text-anchor="middle">5</text><text x="100" y="339" fill="#f0f0f0" font-size="18" font-weight="400" text-anchor="start">Escolha data e hora (até 75 dias) e confirme.</text></svg>