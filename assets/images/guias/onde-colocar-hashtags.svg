<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="t d" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif"><title id="t">Onde colocar as hashtags</title><desc id="d">Exemplo de legenda com o texto primeiro e as hashtags no final.</desc><rect width="800" height="300" rx="20" fill="#1e1e1e"/><text x="40" y="56" fill="#fff" font-size="26" font-weight="800" text-anchor="start">Onde colocar as hashtags</text><text x="40" y="84" fill="#a3a3a3" font-size="16" font-weight="400" text-anchor="start">Pense nelas como etiquetas no final da legenda.</text><rect x="40" y="108" width="480" height="170" rx="12" fill="#111" stroke="#333"/><text x="60" y="142" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">Fineline botânico no antebraço, fechado</text><text x="60" y="166" fill="#f0f0f0" font-size="16" font-weight="400" text-anchor="start">em 3 horas. Quer algo assim? Me chama no Direct.</text><text x="60" y="214" fill="#FF7F50" font-size="16" font-weight="700" text-anchor="start">#tatuagemfeminina #fineline #tatuagemsp</text><line x1="540" y1="154" x2="560" y2="154" stroke="#FF7F50" stroke-width="2"/><text x="570" y="160" fill="#fff" font-size="17" font-weight="800" text-anchor="start">Texto para a pessoa</text><line x1="540" y1="210" x2="560" y2="210" stroke="#FF7F50" stroke-width="2"/><text x="570" y="216" fill="#fff" font-size="17" font-weight="800" text-anchor="start">Etiquetas no final</text><text x="570" y="238" fill="#a3a3a3" font-size="15" font-weight="400" text-anchor="start">Poucas e relevantes</text></svg>